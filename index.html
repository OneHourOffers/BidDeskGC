input[inputmode=decimal]{text-align:right;font-weight:800}
input:focus,textarea:focus{outline:3px solid var(--sky);background:#fff}
textarea{min-height:84px;font-size:16px}
.add{display:grid;grid-template-columns:1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}

.warn{color:#b23a2e;font-size:14px;font-weight:600}
pre{white-space:pre-wrap;font:14px/1.4 ui-monospace,monospace;background:#f3f6f8;padding:10px;border-radius:8px}
.err{padding:40px 16px;text-align:center}
.big{font-size:19px;min-height:60px}
.pdfok{background:#eaf6fb;border-color:#bfe3f2}
</style>
</head>

/* GC portal: sign in with the GC password, see every address sent to you */
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch{return""}};
async function gcCall(pass){const r=await fetch(BID_DESK_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"gcList",gcPass:pass})});return r.json()}
function gcLogin(msg){$("#bar").hidden=true;$("#addr").textContent="Contractor portal";
 $("#app").innerHTML=`<div class="card"><b style="font-size:19px">Sign in</b><p style="color:var(--mute);font-size:15px">Use the password 1HO Holdings gave you.</p><label for="gp">Password</label><input id="gp" type="password" style="text-align:left" autocomplete="current-password"><p class="warn">${esc(msg||"")}</p><button class="btn" id="gpGo">See my properties</button></div>`;
 const go=async()=>{const p=$("#gp").value;try{const j=await gcCall(p);if(j.ok){ls("gc_pass",p);gcListView(j)}else gcLogin(j.error==="gcauth"?"Wrong password.":"Server said: "+j.error)}catch{gcLogin("Couldn't connect — check your signal and try again.")}};
 $("#gpGo").onclick=go;$("#gp").onkeydown=e=>{if(e.key==="Enter")go()}}
function gcListView(j){window.__gcList=j;$("#bar").hidden=true;$("#addr").textContent=(j.gc?j.gc+"'s ":"")+"properties";document.title="My properties";
 const done=b=>{try{const st=JSON.parse(localStorage.getItem("bid-"+b.id)||"{}");return b.submittedAt||st.sentAt}catch{return b.submittedAt}};
 $("#app").innerHTML=`${j.bids.length?j.bids.map((b,k)=>`<button class="room" data-open="${k}" style="display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:0;cursor:pointer;font:inherit;color:inherit"><div class="rh" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>${esc(b.a)}</span><span style="font-size:14px;color:${done(b)?"#9fe3bf":"#FACD88"}">${done(b)?"Bid sent ✓":"Needs your bid"}</span></div><div class="rb" style="color:var(--mute);font-size:15px">${b.r.length} area${b.r.length===1?"":"s"}${b.du?" · due "+esc(b.du):""}${b.submittedAt?" · sent "+esc(new Date(b.submittedAt).toLocaleDateString()):""}</div></button>`).join(""):`<div class="card">Nothing waiting on you right now.</div>`}
 <button class="btn sec" id="gcOut">Sign out</button>`}
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.open!==undefined){const b=window.__gcList.bids[+t.dataset.open];openBid({...b,api:BID_DESK_API,portal:true});wire();return}
 if(t.id==="back"){const p=ls("gc_pass");try{const j=await gcCall(p);j.ok?gcListView(j):gcLogin()}catch{gcListView(window.__gcList)}return}
 if(t.id==="gcOut"){try{localStorage.removeItem("gc_pass")}catch{}gcLogin();return}});
(async()=>{
 if(location.hash&&location.hash.length>2){let b;try{b=await decode(location.hash)}catch{$("#app").innerHTML='<div class="card" style="text-align:center;padding:28px 18px"><b style="font-size:19px">Open this from your bid link</b><p style="color:#567080">This page fills in from the link in your Scope of Work email or text — each property has its own link. Tap that link instead of opening this page directly.</p></div>';return}openBid(b);wire();return}
 if(!BID_DESK_API){$("#app").innerHTML='<div class="card" style="text-align:center;padding:28px 18px"><b style="font-size:19px">Open this from your bid link</b><p style="color:#567080">This page fills in from the link in your Scope of Work email or text — each property has its own link. Tap that link instead of opening this page directly.</p></div>';return}
 const p=ls("gc_pass");if(p){try{const j=await gcCall(p);if(j.ok){gcListView(j);return}}catch{}}gcLogin()})();

}
</script>
</body>
</html>
