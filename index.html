 try{const r=await fetch(B.api||BID_DESK_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"counterReply",id:B.id,bidKey:B.k,accept,lines,note:($("#coNote")?.value||"").trim()})});const j=await r.json();if(!j.ok)throw new Error(j.error||"Server error");
  B.co=null;B.cs=accept?"accepted":"countered";$("#coCard").outerHTML=`<div class="card done" style="font-size:17px">✓ ${accept?`You accepted ${money(amt)}. 1HO has been notified.`:`Sent ${money(amt)} back to 1HO. They'll get back to you.`}</div>`}
 catch(x){t.disabled=false;delete t.dataset.sure;t.textContent="Try again";out.textContent="Couldn't send — "+(x.message||"check your signal")}});
function render(){
 $("#app").innerHTML=`${B.portal?'<button class="btn sec" id="back" style="margin-top:0">← All my properties</button>':""}${B.co&&(B.co.l||[]).length?coHTML():B.cs==="accepted"?`<div class="card done">✓ You accepted 1HO's counter-offer on this one.</div>`:""}<div class="card facts">${B.du?`<div>Need it by <b>${esc(B.du)}</b></div>`:""}${B.ac?`<div>Access: <b>${esc(B.ac)}</b></div>`:""}${B.who?`<div>From: <b>${esc(B.who)}</b></div>`:""}</div>
 <div class="card how"><b>How this works:</b> read each area, type your labor price in its yellow box, add anything we missed at the bottom, then tap <b>Finish &amp; send</b> to get your bid as a PDF to send us. Your numbers save on this phone as you go.</div>
 ${(B.f||[]).length?`<div class="card fincard"><b style="font-size:17px">Finishes for this house</b><p style="margin:2px 0 8px;font-size:14px;color:var(--mute)">Bid your labor using these.</p>${B.f.map(f=>`<div class="finrow"><b>${esc(f[0])}</b><div>${esc([f[1],f[2]].filter(Boolean).join(" — "))}</div>${f[4]?`<div class="fmeta">${esc(f[4])}</div>`:""}${f[5]?`<div class="fmeta">${esc(f[5])}</div>`:""}${/^https:\/\//.test(f[3]||"")?`<a href="${esc(f[3])}" target="_blank" rel="noopener">View product ↗</a>`:""}</div>`).join("")}</div>`:""}
 ${B.r.map((r,i)=>`<div class="room"><div class="rh">${i+1}. ${esc(r[0])}</div><div class="rb">${r[1]?`<p class="work">${esc(r[1])}</p>`:""}${r[2]&&r[2].length?`<p class="inc">Includes: ${esc(r[2].join(", "))}</p>`:""}${r[4]?`<div class="osub"><b>Sub we chose — please coordinate:</b><br>${esc([r[4].c,r[4].n].filter(Boolean).join(" — "))}${r[4].t?" · "+esc(r[4].t):""}<br>${[r[4].p?`<a href="tel:${esc(r[4].p)}">${esc(r[4].p)}</a>`:"",r[4].e?`<a href="mailto:${esc(r[4].e)}">${esc(r[4].e)}</a>`:""].filter(Boolean).join(" · ")}</div>`:""}
  <label for="p${i}">Labor $ for ${esc(r[0])}</label><input id="p${i}" data-i="${i}" inputmode="decimal" enterkeyhint="next" value="${esc(S.p[i]??"")}" placeholder="0">
  ${r[4]?"":`${r[5]?`<div class="recst ${esc(r[5].s)}">Your sub recommendation: <b>${esc(r[5].c||r[5].n||"")}</b> — ${r[5].s==="approved"?"approved by 1HO ✓":r[5].s==="declined"?"declined by 1HO":"waiting on 1HO approval"}</div>`:""}
  <label class="subt"><input type="checkbox" data-sub="${i}" ${S.sub[i]&&S.sub[i].on?"checked":""}> I want to use a sub — recommend one</label>
  ${S.sub[i]&&S.sub[i].on?`<div class="recf"><p style="margin:0 0 6px;font-size:14px;color:var(--mute)">1HO Holdings approves subs before work starts.</p>
   ${[["company","Company","Mike's Plumbing LLC"],["name","Contact name",""],["trade","Trade (plumber, electrician…)",""],["phone","Phone",""],["email","Email",""]].map(([f,l,ph])=>`<label for="sb${i}${f}">${l}</label><input id="sb${i}${f}" data-subn="${i}" data-sf="${f}" value="${esc(S.sub[i][f]||(f==="company"?S.sub[i].name||"":""))}" placeholder="${ph}" ${f==="phone"?'type="tel"':f==="email"?'type="email"':""} style="text-align:left;font-size:16px;min-height:46px;margin-bottom:6px">`).join("")}</div>`:""}`}</div></div>`).join("")}
 <datalist id="areas">${["Clean out","Demo","Plumbing","Electrical"].concat(B.r.map(r=>r[0])).filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<option value="${esc(v)}">`).join("")}</datalist><div class="card"><b>Anything we missed?</b><div id="xs">${S.x.map((x,k)=>`<div class="add"><label for="xa${k}">Area</label><input id="xa${k}" data-x="${k}" data-f="a" value="${esc(x.a)}" placeholder="Pick or type: Clean out, Demo, Kitchen…" list="areas">
  <div class="two"><div><label for="xd${k}">What needs done</label><input id="xd${k}" data-x="${k}" data-f="d" value="${esc(x.d)}"></div><div><label for="xl${k}">Labor $</label><input id="xl${k}" data-x="${k}" data-f="l" inputmode="decimal" value="${esc(x.l)}" placeholder="0"></div></div>
  <button class="x" data-rm="${k}">Remove</button></div>`).join("")}</div><button class="btn plus" id="addx">+ Add something we missed</button></div>
 <div class="card" id="finish"><label for="days">Timeline (working days)</label><input id="days" data-s="days" inputmode="numeric" value="${esc(S.days)}" style="text-align:left">
  <label for="start" style="margin-top:10px">Earliest start</label><input id="start" data-s="start" type="date" value="${esc(S.start)}">
  <label for="notes" style="margin-top:10px">Notes / exclusions</label><textarea id="notes" data-s="notes">${esc(S.notes)}</textarea>
  <label for="name" style="margin-top:10px">Your name</label><input id="name" data-s="name" value="${esc(S.name)}" style="text-align:left">
  <p class="warn" id="chk"></p>
  <button class="btn big" id="mkpdf">Finish &amp; send my bid (PDF)</button>
  <div id="out"></div>
  <details style="margin-top:12px"><summary style="color:var(--mute);font-size:14px;cursor:pointer">Other ways to send</summary>
  ${B.to?`<a class="btn sec" id="email" href="#">Send as an email (no PDF)</a>`:""}${B.sms?`<a class="btn sec" id="sms" href="#">Send as a text (no PDF)</a>`:""}<button class="btn sec" id="copy">Copy my bid</button></details></div>`;
 $("#bar").hidden=false;totals()}
function totals(){$("#tot").textContent=money(total());const blank=B.r.filter((_,i)=>!String(S.p[i]??"").trim()).length;const c=$("#chk");if(c)c.textContent=blank?`${blank} area${blank===1?"":"s"} still blank — fine if $0.`:""}
function openBid(b0){B=b0;$("#addr").textContent=B.a||"Labor Bid";document.title="Bid — "+(B.a||"");window.scrollTo(0,0);

 key="bid-"+B.id;try{S=JSON.parse(localStorage.getItem(key))}catch{}S=S||{};S.p=S.p||{};S.x=S.x||[];S.sub=S.sub||{};S.days=S.days||"";S.start=S.start||"";S.notes=S.notes||"";S.name=S.name||B.gc||"";
 render();}
let wired=false;function wire(){if(wired)return;wired=true;
 document.addEventListener("change",e=>{const d=e.target.dataset;if(d.sub===undefined)return;S.sub[d.sub]=S.sub[d.sub]||{};S.sub[d.sub].on=e.target.checked;store();render();const n=document.querySelector(`[data-subn="${d.sub}"]`);if(n)n.focus()});
 document.addEventListener("input",e=>{const d=e.target.dataset;if(d.subn!==undefined){S.sub[d.subn][d.sf||"company"]=e.target.value;store();return}if(d.i!==undefined)S.p[d.i]=e.target.value;else if(d.x!==undefined)S.x[+d.x][d.f]=e.target.value;else if(d.s)S[d.s]=e.target.value;else return;store();totals()});
 document.addEventListener("click",async e=>{const t=e.target.closest("a,button");if(!t)return;
  if(t.id==="addx"){S.x.push({a:"",d:"",l:""});store();render();$(`#xa${S.x.length-1}`).focus();return}
  if(t.dataset.rm){S.x.splice(+t.dataset.rm,1);store();render();return}
  if(t.id==="jump"){e.preventDefault();$("#finish").scrollIntoView({behavior:"smooth"});return}
  if(t.id==="mkpdf"||t.id==="share"||t.id==="dlpdf"){e.preventDefault();const blank=B.r.filter((_,i)=>!String(S.p[i]??"").trim()).length;
   let bytes;try{bytes=await bidPdf()}catch(z){$("#out").innerHTML='<div class="card warn">Couldn\'t build the PDF — check your connection and try again, or use "Other ways to send".</div>';return}
   const file=new File([bytes],fname(),{type:"application/pdf"});window.__lastPdf=bytes;
   const canShare=navigator.canShare&&navigator.canShare({files:[file]});
   if(t.id==="mkpdf"&&B.api&&B.k&&!t.dataset.offline){t.disabled=true;t.textContent="Sending…";
    try{let bin="";for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));
     const form={labor:{},add:S.x.filter(x=>x.d.trim()||num(x.l)).map(x=>({area:x.a.trim(),desc:x.d.trim(),labor:String(num(x.l))})),days:S.days,start:S.start,notes:S.notes.trim(),name:S.name.trim(),total:Math.round(total())};
     form.subs={};B.r.forEach((r,i)=>{form.labor[r[3]||String(i)]=String(num(S.p[i]));const sb=S.sub[i];if(sb&&sb.on)form.subs[r[3]||String(i)]={company:(sb.company||sb.name||"").trim(),name:(sb.name&&sb.company?sb.name:"").trim(),trade:(sb.trade||"").trim(),phone:(sb.phone||"").trim(),email:(sb.email||"").trim()}});
     const res=await fetch(B.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"submitBid",id:B.id,bidKey:B.k,form,pdf:btoa(bin),pdfName:fname()})});const j=await res.json();
     if(!j.ok)throw new Error(j.error||"Server error");S.sentAt=new Date().toISOString();store();
     $("#out").innerHTML=`<div class="card done" style="font-size:17px">✓ Bid sent to ${esc(B.who||"1HO Holdings")} — ${money(total())} labor. You're all set.<br><span style="font-weight:500;font-size:14px;color:var(--ink)">Need a copy for yourself?</span><button class="btn sec" id="dlpdf">Download your bid PDF</button></div>`;t.textContent="Sent ✓ — tap to resend";t.disabled=false}
    catch(z){t.disabled=false;t.textContent="Finish & send my bid (PDF)";t.dataset.offline=1;$("#out").innerHTML=`<div class="card warn">Couldn't send it automatically (${esc(z.message||"no connection")}). Tap <b>Finish &amp; send</b> again to send the PDF yourself.</div>`}
    $("#out").scrollIntoView({behavior:"smooth"});return}
   if(t.id==="mkpdf"){$("#out").innerHTML=`<div class="card pdfok"><b>Your bid PDF is ready${blank?` (${blank} area${blank===1?"":"s"} at $0)`:""}.</b><br>Send it to ${esc(B.who||"us")}${B.to?` at <b>${esc(B.to)}</b>`:""}${B.sms?` or text it to <b>${esc(B.sms)}</b>`:""}.
     ${canShare?`<button class="btn" id="share">Send the PDF</button>`:""}<button class="btn ${canShare?"sec":""}" id="dlpdf">Download the PDF</button>${B.to?`<p style="font-size:14px;color:var(--mute)">After downloading, attach it to an email to ${esc(B.to)}.</p>`:""}</div>`;$("#out").scrollIntoView({behavior:"smooth"});return}
   if(t.id==="share"){try{await navigator.share({files:[file],title:`Labor bid — ${B.a}`,text:`Labor bid for ${B.a} (${B.id}) — total ${"$"+Math.round(total()).toLocaleString("en-US")}`})}catch(z){}return}
   const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=fname();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return}
  const body=summary(),subj=`Re: Scope of Work — ${B.a} [${B.id}]`;
  if(t.id==="email"){e.preventDefault();location.href="mailto:"+encodeURIComponent(B.to)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);$("#out").innerHTML='<div class="card done">Your mail app should open with your bid filled in — just hit Send.</div>'}
  if(t.id==="sms"){e.preventDefault();const sep=/iPhone|iPad|Mac/.test(navigator.userAgent)?"&":"?";location.href="sms:"+encodeURIComponent(B.sms)+sep+"body="+encodeURIComponent(body);$("#out").innerHTML='<div class="card done">Your texts should open with your bid filled in — just hit Send.</div>'}
  if(t.id==="copy"){try{await navigator.clipboard.writeText(body);t.textContent="Copied ✓ — paste it in a text or email"}catch{$("#out").innerHTML=`<pre>${esc(body)}</pre>`}}})}
/* GC portal: sign in with the GC password, see every address sent to you */
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch{return""}};
async function gcCall(pass){const r=await fetch(BID_DESK_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"gcList",gcPass:pass})});return r.json()}
function gcLogin(msg){$("#bar").hidden=true;$("#addr").textContent="Contractor portal";
 $("#app").innerHTML=`<div class="card"><b style="font-size:19px">Sign in</b><p style="color:var(--mute);font-size:15px">Use the password 1HO Holdings gave you.</p><label for="gp">Password</label><input id="gp" type="password" style="text-align:left" autocomplete="current-password"><p class="warn">${esc(msg||"")}</p><button class="btn" id="gpGo">See my properties</button></div>`;
 const go=async()=>{const p=$("#gp").value;try{const j=await gcCall(p);if(j.ok){ls("gc_pass",p);gcListView(j)}else gcLogin(j.error==="gcauth"?"Wrong password.":"Server said: "+j.error)}catch{gcLogin("Couldn't connect — check your signal and try again.")}};
 $("#gpGo").onclick=go;$("#gp").onkeydown=e=>{if(e.key==="Enter")go()}}
function gcListView(j){window.__gcList=j;$("#bar").hidden=true;$("#addr").textContent=(j.gc?j.gc+"'s ":"")+"properties";document.title="My properties";
 const done=b=>{try{const st=JSON.parse(localStorage.getItem("bid-"+b.id)||"{}");return b.submittedAt||st.sentAt}catch{return b.submittedAt}};
 $("#app").innerHTML=`${j.bids.length?j.bids.map((b,k)=>`<button class="room" data-open="${k}" style="display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:0;cursor:pointer;font:inherit;color:inherit"><div class="rh" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>${esc(b.a)}</span><span style="font-size:14px;color:${b.co?"#FACD88":done(b)?"#9fe3bf":"#FACD88"}">${b.co?"Counter-offer — respond":b.cs==="accepted"?"Agreed ✓":done(b)?"Bid sent ✓":"Needs your bid"}</span></div><div class="rb" style="color:var(--mute);font-size:15px">${b.r.length} area${b.r.length===1?"":"s"}${b.du?" · due "+esc(b.du):""}${b.submittedAt?" · sent "+esc(new Date(b.submittedAt).toLocaleDateString()):""}</div></button>`).join(""):`<div class="card">Nothing waiting on you right now.</div>`}
 <button class="btn sec" id="gcOut">Sign out</button>`}
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.open!==undefined){const b=window.__gcList.bids[+t.dataset.open];openBid({...b,api:BID_DESK_API,portal:true});wire();return}
 if(t.id==="back"){const p=ls("gc_pass");try{const j=await gcCall(p);j.ok?gcListView(j):gcLogin()}catch{gcListView(window.__gcList)}return}
 if(t.id==="gcOut"){try{localStorage.removeItem("gc_pass")}catch{}gcLogin();return}});
(async()=>{
 if(location.hash&&location.hash.length>2){let b;try{b=await decode(location.hash)}catch{$("#app").innerHTML='<div class="card" style="text-align:center;padding:28px 18px"><b style="font-size:19px">Open this from your bid link</b><p style="color:#567080">This page fills in from the link in your Scope of Work email or text — each property has its own link. Tap that link instead of opening this page directly.</p></div>';return}openBid(b);wire();return}
 if(!BID_DESK_API){$("#app").innerHTML='<div class="card" style="text-align:center;padding:28px 18px"><b style="font-size:19px">Open this from your bid link</b><p style="color:#567080">This page fills in from the link in your Scope of Work email or text — each property has its own link. Tap that link instead of opening this page directly.</p></div>';return}
 const p=ls("gc_pass");if(p){try{const j=await gcCall(p);if(j.ok){gcListView(j);return}}catch{}}gcLogin()})();

}
